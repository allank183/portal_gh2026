name: portal_lapker
description: "Portal Lapker"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  geolocator: ^14.0.2
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  file_picker: ^11.0.3
  flutter_image_compress: ^2.5.1
  minio_new: ^1.0.2
  syncfusion_flutter_pdf: ^28.2.3
  syncfusion_flutter_pdfviewer: ^28.2.3
  flutter_dotenv: ^5.2.1
  csv: ^8.0.0
  google_fonts: ^6.1.0
  url_launcher: ^6.2.5
  printing: ^5.13.0
  http: any
  geocoding: ^3.0.0
  universal_html: ^2.2.4
  excel: ^4.0.6
  intl: any
  flutter_markdown: ^0.7.7+1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/haki.png
    - assets/sertifikat_haki.pdf

dependency_overrides:
  http: ^1.2.0